[defaults]
inventory = inventory
host_key_checking = False
forks = 10
retry_files_enabled = False
interpreter_python = auto_silent
# readable task output
callback_result_format = yaml
# SSH connection timeout in seconds
timeout = 30

[ssh_connection]
pipelining = True
# ServerAlive* makes ssh notice a dead connection after ~2 minutes instead of
# hanging forever (a silently dropped connection can otherwise wedge a sweep).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o ConnectTimeout=30
# retry transient connection failures (exit code 255) a few times
retries = 3
